name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            pkg_name: sout-linux-amd64
          - goos: linux
            goarch: arm64
            pkg_name: sout-linux-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build Binary and Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi
          mkdir -p dist/${{ matrix.pkg_name }}
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o dist/${{ matrix.pkg_name }}/sout-server .
          cp dist/${{ matrix.pkg_name }}/sout-server dist/${{ matrix.pkg_name }}/sout
          cp dist/${{ matrix.pkg_name }}/sout-server dist/${{ matrix.pkg_name }}/fanout
          cp f.sh dist/${{ matrix.pkg_name }}/
          cp sout.service dist/${{ matrix.pkg_name }}/
          cp fanout.service dist/${{ matrix.pkg_name }}/
          tar -czf ${{ matrix.pkg_name }}.tar.gz -C dist/${{ matrix.pkg_name }} sout-server sout fanout f.sh sout.service fanout.service

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg_name }}
          path: ${{ matrix.pkg_name }}.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release_assets
          sha256sum sout-linux-*.tar.gz > checksums.txt

      - name: Determine Tag
        id: tag_info
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          files: |
            release_assets/sout-linux-amd64.tar.gz
            release_assets/sout-linux-arm64.tar.gz
            release_assets/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
